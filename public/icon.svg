<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="lGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c38" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Black Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="270" r="160" fill="#f97316" opacity="0.12" filter="blur(40px)" />

  <!-- Stylized Geometric 'L' -->
  <g filter="url(#glow)">
    <!-- Main Angular L Monogram Body -->
    <path 
      d="M 172 112 
         L 242 112 
         L 242 320 
         L 348 320 
         L 366 352 
         L 344 388 
         L 172 388 
         Z" 
      fill="url(#lGrad)" 
    />
    <!-- Futuristic Chamfer Slash / Geometric Segment -->
    <path 
      d="M 276 332 
         L 338 332 
         L 378 388 
         L 316 388 
         Z" 
      fill="#fb923c" 
      opacity="0.9"
    />
    <!-- Sleek Top Highlight Blade -->
    <path 
      d="M 172 112 
         L 242 112 
         L 242 180 
         L 216 206 
         L 172 206 
         Z" 
      fill="url(#neonAccent)" 
      opacity="0.85"
    />
    <!-- Dot / Cyber Accent Core -->
    <circle cx="366" cy="286" r="12" fill="#ffedd5" opacity="0.95" />
  </g>
</svg>
