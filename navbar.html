<!--
╔══════════════════════════════════════════════════════════════════════════════╗
║  NAVBAR STANDALONE — Sidebar HUD + Mobile Header + Search + Sliding Menu  ║
╠══════════════════════════════════════════════════════════════════════════════╣
║  Arquivo autocontido com HTML, CSS e JS completos.                         ║
║  Basta copiar este arquivo e incluir na sua página.                        ║
╠══════════════════════════════════════════════════════════════════════════════╣
║  COMO USAR:                                                                ║
║                                                                            ║
║  1. Copie todo o conteúdo deste arquivo para um arquivo .html              ║
║  2. Adicione um container no <body> da sua página:                         ║
║     <div id="navbar-container"></div>                                       ║
║  3. Coloque este container como PRIMEIRO filho do <body>                   ║
║  4. Adicione padding-left no body para desktop (76px colapsado):           ║
║     <style>body { margin: 0; padding: 0; }                                 ║
║     @media (min-width: 769px) { body { padding-left: 76px; } }             ║
║     @media (max-width: 768px) { body { padding-top: 65px; } }</style>      ║
║  5. Copie as variáveis CSS do :root para o seu main.css (ver SEÇÃO 1)      ║
║  6. Ajuste os hrefs dos links para apontar às suas páginas                 ║
║  7. Ajuste o caminho da logo (Assets/Images/LogoItens/D.jpg)               ║
║                                                                            ║
║  ARQUITETURA:                                                              ║
║  • Desktop (> 768px): Sidebar HUD fixa à esquerda (76px → 256px hover)    ║
║  • Mobile (≤ 768px): Header fixo no topo + hamburger → sidebar deslizante ║
║  • Barra de progresso no topo em todas as telas                            ║
║  • Search overlay com Ctrl+K                                               ║
║                                                                            ║
║  Z-INDEX HIERARCHY:                                                        ║
║  progressBar: 10001 | sidebar: 999 | mobile header: 1000                  ║
║  sidebar-overlay: 9998 | sidebar-menu: 9999 | search: 9990                ║
║                                                                            ║
║  DEPENDÊNCIAS:                                                             ║
║  • Google Font: Rajdhani (300-900)                                         ║
║  • Imagem de logo em ./Assets/Images/LogoItens/D.jpg                       ║
║  • Opcional: thememanager.js para troca de temas                           ║
╚══════════════════════════════════════════════════════════════════════════════╝
-->

<!--
  ╔═════════════════════════════════════════════════════════════╗
  ║  SEÇÃO 1: CSS VARIABLES — Copie para o seu :root           ║
  ╚═════════════════════════════════════════════════════════════╝
  
  Adicione estas variáveis no :root do seu CSS principal para
  suportar troca dinâmica de temas via ThemeManager:
  
  :root {
      --theme-primary: #8b5cf6;
      --theme-primary-light: #c084fc;
      --theme-primary-dark: #6d28d9;
      --theme-accent: #f5a6d3;
      --theme-glow: rgba(139, 92, 246, 0.8);
      --theme-shadow: rgba(139, 92, 246, 0.4);
      --theme-border: rgba(139, 92, 246, 0.4);
      --theme-border-light: rgba(139, 92, 246, 0.2);
      --theme-overlay: rgba(139, 92, 246, 0.1);
      --theme-background-card-hover: rgba(139, 92, 246, 0.15);
      --theme-gradient: linear-gradient(135deg, #8b5cf6, #6d28d9);
  }
-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Standalone</title>

    <!-- Google Font Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        /* =================================================================
           RESET & BASE
           ================================================================= */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --theme-primary: #8b5cf6;
            --theme-primary-light: #c084fc;
            --theme-primary-dark: #6d28d9;
            --theme-accent: #f5a6d3;
            --theme-glow: rgba(139, 92, 246, 0.8);
            --theme-shadow: rgba(139, 92, 246, 0.4);
            --theme-border: rgba(139, 92, 246, 0.4);
            --theme-border-light: rgba(139, 92, 246, 0.2);
            --theme-overlay: rgba(139, 92, 246, 0.1);
            --theme-background-card-hover: rgba(139, 92, 246, 0.15);
            --theme-gradient: linear-gradient(135deg, #8b5cf6, #6d28d9);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
        }

        /* Desktop: sidebar pushes content */
        @media (min-width: 769px) {
            body { padding-left: 76px; transition: padding-left 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        }

        /* Mobile: header pushes content */
        @media (max-width: 768px) {
            body { padding-top: 65px; }
        }

        /* =================================================================
           PROGRESS BAR
           ================================================================= */
        #progressBar {
            position: fixed;
            top: 0; left: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--theme-primary), var(--theme-primary-light));
            width: 0%;
            transition: width 0.1s linear;
            z-index: 10001;
            box-shadow: 0 0 10px var(--theme-glow);
        }

        /* =================================================================
           MOBILE HEADER (≤ 768px)
           ================================================================= */
        .mobile-header {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            z-index: 1000;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--theme-border-light);
        }

        .mobile-header.scrolled {
            background: rgba(0, 0, 0, 0.85);
            border-bottom-color: var(--theme-border);
        }

        .mobile-header nav { background: transparent; }

        .mobile-header .nav-container {
            max-width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mobile-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
        }

        .mobile-header .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .mobile-header .logo-icon {
            width: 35px; height: 35px;
            background: linear-gradient(135deg, var(--theme-primary), var(--theme-primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            object-fit: cover;
        }

        .mobile-header .nav-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        @media (min-width: 769px) {
            .mobile-header { display: none !important; }
        }

        /* =================================================================
           DESKTOP SIDEBAR HUD (> 768px)
           ================================================================= */
        .sidebar-hud {
            position: fixed;
            top: 0; left: 0;
            height: 100vh;
            width: 76px;
            z-index: 999;
            background: rgba(3, 5, 16, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid var(--theme-border-light);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: width 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 4px 0 24px rgba(3, 5, 16, 0.8);
            overflow: hidden;
            user-select: none;
        }

        .sidebar-hud.hovered,
        .sidebar-hud.pinned { width: 256px; }

        @media (min-width: 769px) {
            body.sidebar-layout-collapsed { padding-left: 76px; }
            body.sidebar-layout-pinned    { padding-left: 256px; }
        }

        @media (max-width: 768px) {
            .sidebar-hud { display: none !important; }
        }

        /* --- Brand --- */
        .sidebar-brand {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
            cursor: pointer;
            overflow: hidden;
        }

        .brand-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .logo-icon-container {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--theme-primary), var(--theme-primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
            transition: transform 0.3s ease;
        }

        .sidebar-brand:hover .logo-icon-container {
            transform: rotate(15deg) scale(1.05);
        }

        .logo-img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateX(-15px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            white-space: nowrap;
        }

        .sidebar-hud.hovered .brand-text,
        .sidebar-hud.pinned .brand-text {
            opacity: 1;
            transform: translateX(0);
        }

        .brand-title {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            line-height: 1;
            font-family: 'Rajdhani', sans-serif;
        }

        .brand-subtitle {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--theme-primary-light);
            margin-top: 3px;
            text-transform: uppercase;
        }

        .sidebar-brand-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .sidebar-login-btn,
        .sidebar-pin-btn {
            background: transparent;
            border: none;
            color: #555;
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease, color 0.2s ease, background 0.2s ease;
        }

        .sidebar-login-btn:hover,
        .sidebar-pin-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .sidebar-pin-btn.active { color: var(--theme-primary-light); opacity: 1; }

        .sidebar-hud.hovered .sidebar-login-btn,
        .sidebar-hud.hovered .sidebar-pin-btn,
        .sidebar-hud.pinned .sidebar-login-btn,
        .sidebar-hud.pinned .sidebar-pin-btn { opacity: 1; }

        /* --- Navigation Items --- */
        .sidebar-navigation {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 14px 10px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar-navigation::-webkit-scrollbar { width: 4px; }
        .sidebar-navigation::-webkit-scrollbar-thumb {
            background: var(--theme-border-light);
            border-radius: 2px;
        }

        .sidebar-nav-item {
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .hud-active-bar {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 0;
            background: linear-gradient(to bottom, var(--theme-primary), var(--theme-accent));
            box-shadow: 0 0 10px var(--theme-primary);
            border-radius: 0 4px 4px 0;
            transition: width 0.25s ease;
        }

        .sidebar-nav-link {
            display: flex;
            align-items: center;
            width: 100%;
            height: 44px;
            padding: 0 16px;
            background: transparent;
            border: 1px solid transparent;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            outline: none;
            position: relative;
            overflow: hidden;
        }

        .sidebar-nav-item .sidebar-nav-link.search-icon-btn {
            width: 100%; height: 44px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border-radius: 6px;
            font-size: inherit;
        }

        .sidebar-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 20px;
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .sidebar-text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-left: 16px;
            opacity: 0;
            transform: translateX(-15px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            white-space: nowrap;
            text-align: left;
        }

        .sidebar-hud.hovered .sidebar-text-group,
        .sidebar-hud.pinned .sidebar-text-group {
            opacity: 1;
            transform: translateX(0);
        }

        .sidebar-label {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: inherit;
            line-height: 1.2;
        }

        .sidebar-desc {
            font-size: 9px;
            font-weight: 500;
            color: #555;
            line-height: 1;
            margin-top: 2px;
        }

        .chevron-icon {
            margin-left: auto;
            color: #555;
            transition: transform 0.2s ease, opacity 0.2s ease;
            opacity: 0;
        }

        .sidebar-hud.hovered .chevron-icon,
        .sidebar-hud.pinned .chevron-icon { opacity: 1; }

        .sidebar-nav-item.expanded .chevron-icon { transform: rotate(180deg); }

        .sidebar-nav-link:hover {
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            border-color: rgba(139, 92, 246, 0.1);
        }

        .sidebar-nav-link:hover .sidebar-icon {
            transform: scale(1.1);
            color: var(--theme-primary-light);
        }

        .sidebar-nav-link:hover .sidebar-desc { color: #888; }

        .sidebar-nav-link.active {
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.1), transparent);
            color: var(--theme-primary-light);
            border-color: rgba(139, 92, 246, 0.2);
        }

        .sidebar-nav-link.active .hud-active-bar { width: 4px; }

        .sidebar-nav-link.active .sidebar-icon {
            color: var(--theme-primary-light);
            filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.6));
        }

        .submenu-trigger.active-parent {
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.1), transparent);
            color: var(--theme-primary-light);
            border-color: rgba(139, 92, 246, 0.2);
        }

        .submenu-trigger.active-parent .hud-active-bar { width: 4px; }
        .submenu-trigger.active-parent .sidebar-icon {
            color: var(--theme-primary-light);
            filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.6));
        }
        .submenu-trigger.active-parent .sidebar-label { color: var(--theme-primary-light); }

        /* Submenu */
        .sidebar-submenu-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-left: 54px;
        }

        .sidebar-hud.hovered .sidebar-nav-item.expanded .sidebar-submenu-list,
        .sidebar-hud.pinned .sidebar-nav-item.expanded .sidebar-submenu-list {
            max-height: 300px;
            margin-top: 4px;
        }

        .sidebar-hud:not(.hovered):not(.pinned) .sidebar-submenu-list {
            max-height: 0 !important;
        }

        .sidebar-sub-item-link {
            display: block;
            padding: 8px 12px;
            color: #64748b;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-radius: 4px;
            transition: all 0.2s ease;
            white-space: nowrap;
            text-align: left;
        }

        .sidebar-sub-item-link::before {
            content: '•';
            color: var(--theme-primary);
            margin-right: 8px;
            font-size: 10px;
        }

        .sidebar-sub-item-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
            padding-left: 18px;
        }

        .sidebar-sub-item-link.active {
            color: var(--theme-primary-light);
            background: rgba(139, 92, 246, 0.05);
        }

        /* --- Bottom Utilities --- */
        .sidebar-utilities {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 6px 10px;
            border-top: 1px solid rgba(139, 92, 246, 0.1);
        }

        .sidebar-utilities .lang-selector,
        .sidebar-utilities .theme-selector {
            position: relative;
            width: 100%;
            height: 38px;
            display: flex;
            align-items: center;
        }

        .sidebar-utilities .lang-btn,
        .sidebar-utilities .theme-btn {
            width: 100%; height: 38px;
            padding: 0 16px;
            justify-content: flex-start;
            gap: 12px;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            border-radius: 6px;
            color: #64748b;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            transition: all 0.2s ease;
        }

        .sidebar-utilities .lang-btn {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .sidebar-utilities .lang-btn svg,
        .sidebar-utilities .theme-btn svg {
            flex-shrink: 0;
            width: 18px; height: 18px;
        }

        .sidebar-utilities .lang-btn .util-label,
        .sidebar-utilities .theme-btn .util-label { margin-left: 0; }

        .sidebar-utilities .lang-btn:hover,
        .sidebar-utilities .theme-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
        }

        /* --- Theme/Language Dropdowns --- */
        .lang-selector, .theme-selector { position: relative; }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--theme-border-light);
            color: #fff;
            padding: 8px 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 600;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            border-radius: 2px;
        }

        .lang-btn:hover {
            color: var(--theme-primary-light);
            border-color: var(--theme-primary-light);
            background: var(--theme-overlay);
        }

        .lang-dropdown,
        .theme-dropdown {
            position: fixed;
            min-width: 200px;
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            border: 1px solid var(--theme-border);
            border-top: 3px solid var(--theme-primary);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9);
            max-height: 350px;
            overflow-y: auto;
            border-radius: 4px;
            z-index: 10002;
        }

        .lang-dropdown.active,
        .theme-dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .lang-option,
        .theme-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 18px;
            color: #aaa;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(139, 92, 246, 0.15);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .lang-option::before,
        .theme-option::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 0; height: 100%;
            background: var(--theme-overlay);
            transition: width 0.3s ease;
            z-index: -1;
        }

        .lang-option:hover::before,
        .theme-option:hover::before { width: 100%; }

        .lang-option:last-child,
        .theme-option:last-child { border-bottom: none; }

        .lang-option:hover,
        .theme-option:hover { color: #fff; padding-left: 23px; }

        .lang-option.active,
        .theme-option.active {
            color: var(--theme-primary);
            background: var(--theme-overlay);
        }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--theme-border-light);
            color: #fff;
            padding: 8px 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px; height: 36px;
            border-radius: 2px;
        }

        .theme-btn:hover {
            border-color: var(--theme-primary);
            background: var(--theme-overlay);
            transform: scale(1.05);
        }

        .nav-buy-button {
            background: linear-gradient(135deg, var(--theme-primary), var(--theme-primary-dark));
            border: 2px solid var(--theme-primary);
            color: #fff;
            padding: 10px 24px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 2px;
            transition: all 0.3s ease;
            font-family: 'Rajdhani', sans-serif;
        }

        .nav-buy-button:hover {
            background: linear-gradient(135deg, var(--theme-primary-light), var(--theme-primary));
            box-shadow: 0 0 20px var(--theme-glow);
            transform: scale(1.05);
        }

        /* =================================================================
           HAMBURGER & MOBILE SLIDING SIDEBAR
           ================================================================= */
        .menu-icon {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 40px; height: 40px;
            cursor: pointer;
            background: transparent;
            border: none;
            gap: 5px;
            transition: all 0.3s ease;
            padding: 0;
        }

        .menu-icon:hover { transform: scale(1.1); }

        .menu-icon-svg {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%; height: 100%;
            align-items: center;
            justify-content: center;
        }

        .menu-icon-svg span {
            display: block;
            width: 24px; height: 3px;
            background: #fff;
            border-radius: 2px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-icon.active .menu-icon-svg span:nth-child(1) { transform: rotate(45deg) translate(10px, 10px); }
        .menu-icon.active .menu-icon-svg span:nth-child(2) { opacity: 0; }

                    <div class="sidebar-section collapsible"><div class="sidebar-link has-submenu" id="suporteMenu"><div class="sidebar-link-content"><span class="sidebar-link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span><span class="sidebar-link-text">Suporte</span></div></div><div class="sidebar-submenu" id="suporteSubmenu"><a href="./faq.html" class="sidebar-sublink">FAQ</a><a href="./suporte.html" class="sidebar-sublink">Contato</a><a href="./sobre.html" class="sidebar-sublink">Sobre Nos</a></div></div>

                    <div class="sidebar-social">
                        <a href="#" class="sidebar-social-icon" title="Instagram"><svg viewBox="0 0 24 24"><path d="M7.0301.084c-1.2768.0602-2.1487.264-2.911.5651-.6865.2642-1.265.6193-1.8353 1.1905-.5636.5663-.9149 1.1346-1.1631 1.8073-.3624.88-.5831 1.7432-.6224 2.9786-.0545 1.5012.0213 1.9776.0991 3.7428.1079 2.4694.4804 3.972.9966 5.6721.5199 1.7228 1.5235 3.2553 2.9503 4.3874 1.3343 1.0871 3.037 1.8571 4.8383 2.1228 1.2788.207 2.6699.1954 4.97.0429 2.3012-.1264 3.2231-.3899 4.9-1.0871 1.3343-1.8571 3.037-2.1228 4.8383-.207 1.2788-.1954 2.6699-.0429 4.97.1264 2.3012.3899 3.2231 1.0871 4.9 1.3343 1.3343 1.8571 3.037 2.1228 4.8383.207 1.2788.1954 2.6699.0429 4.97.1264 2.3012.3899 3.2231 1.0871 4.9-1.3343 1.3343-1.8571 3.037-2.1228 4.8383M12.896 2.252c2.6487 0 3.106.0116 4.2046.0603 1.0921.0577 1.6846.2873 2.0793.4773.522.2454.8945.5384 1.2856.9295.391.391.6841.7636.9295 1.2856.1905.4947.4196 1.0872.4773 2.0793.0487 1.0946.0603 1.5559.0603 4.2046 0 2.6487-.0116 3.106-.0603 4.2046-.0577 1.0921-.2873 1.6846-.4773 2.0793-.2454.522-.5384.8945-.9295 1.2856-.391.391-.7636.6841-1.2856.9295-.4947.1905-1.0872.4196-2.0793.4773-1.0946.0487-1.5559.0603-4.2046.0603-2.6487 0-3.106-.0116-4.2046-.0603-1.0921-.0577-1.6846-.2873-2.0793-.4773-.522-.2454-.8945-.5384-1.2856-.9295-.391.391-.7636.6841-1.2856.9295-.4947.1905-1.0872.4196-2.0793.4773-1.0946.0487-1.5559.0603-4.2046.0603m0 3.8112c-2.771 0-5.0188 2.2478-5.0188 5.0188s2.2478 5.0188 5.0188 5.0188 5.0188-2.2478 5.0188-5.0188-2.2478-5.0188-5.0188-5.0188zm0 8.3033c-1.8063 0-3.2845-1.4782-3.2845-3.2845s1.4782-3.2845 3.2845-3.2845 3.2845 1.4782 3.2845 3.2845-1.4782 3.2845-3.2845 3.2845zm4.3053-8.6477c0 .6476.5283 1.176 1.176 1.176s1.176-.5283 1.176-1.176-.5283-1.176-1.176-1.176-1.176.5283-1.176 1.176z"/></svg></a>

    // ===== INJECT HTML =====
    const container = document.getElementById('navbar-container');
    if (container) container.innerHTML = navbarHTML + searchHTML + sidebarHTML;

    // ===== SEARCH DATABASE =====
    const searchDatabase = [
        { id: 1, title: 'Mortal Kombat 11', description: 'MK de volta e melhor do que nunca.', category: 'games', tag: 'Luta' },
        { id: 2, title: 'Street Fighter 6', description: 'Ultimo titulo da serie SF.', category: 'games', tag: 'Luta' },
        { id: 3, title: 'Batman: O Cavaleiro das Trevas', description: 'HQ epica e inesperada.', category: 'hq', tag: 'Super-heroi' },
        { id: 4, title: 'X-Men: Era do Apocalipse', description: 'Os X-Men enfrentam seu maior inimigo.', category: 'hq', tag: 'Super-heroi' },
        { id: 5, title: 'Noticia: Novo Jogo Anunciado', description: 'Desenvolvedora anuncia titulo revolucionario.', category: 'news', tag: 'Noticia' },
        { id: 6, title: 'Liu Kang - Operador', description: 'Mestre dos elementos, versatil e poderoso.', category: 'operators', tag: 'Personagem' },
    ];

    // ===== PROGRESS BAR =====
    const progressBar = document.getElementById('progressBar');
    if (progressBar) {
        window.addEventListener('scroll', () => {
            const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            progressBar.style.width = (scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0) + '%';
        });
    }

    // ===== MOBILE HEADER SCROLL =====
    const mobileHeader = document.querySelector('.mobile-header');
    if (mobileHeader) {
        window.addEventListener('scroll', () => {
            mobileHeader.classList.toggle('scrolled', window.pageYOffset > 50);
        });
    }

    // ===== SEARCH =====
    const searchOverlay = document.getElementById('searchOverlay');
    const searchInput = document.getElementById('searchInput');
    const searchResultsList = document.getElementById('searchResultsList');
    const resultsCount = document.getElementById('resultsCount');
    const searchFilters = document.querySelectorAll('.search-filter');
    const filtersToggle = document.getElementById('filtersToggle');
    const searchFiltersSection = document.getElementById('searchFiltersSection');

    if (filtersToggle && searchFiltersSection) {
        filtersToggle.addEventListener('click', () => searchFiltersSection.classList.toggle('expanded'));
    }

    function openSearchOverlay() {
        if (searchOverlay) { searchOverlay.classList.add('active', 'compact'); document.body.style.overflow = 'hidden'; }
        if (searchInput) { searchInput.value = ''; setTimeout(() => searchInput.focus(), 100); }
    }

    function closeSearchOverlay() {
        if (searchOverlay) searchOverlay.classList.remove('active', 'compact');
        document.body.style.overflow = '';
        if (searchInput) searchInput.value = '';
        if (searchFiltersSection) searchFiltersSection.classList.remove('expanded');
        if (searchResultsList) searchResultsList.innerHTML = '<div class="search-empty"><p class="search-empty-title">Nenhum resultado encontrado</p><p class="search-empty-text">Digite um termo ou use os filtros</p></div>';
        if (resultsCount) resultsCount.textContent = '0';
    }

    document.querySelectorAll('.search-icon-btn').forEach(btn => {
        btn.addEventListener('click', e => { e.stopPropagation(); openSearchOverlay(); });
    });

    document.getElementById('searchCloseBtn')?.addEventListener('click', closeSearchOverlay);
    searchOverlay?.addEventListener('click', e => { if (e.target === searchOverlay) closeSearchOverlay(); });

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && searchOverlay?.classList.contains('active')) {
            if (!searchOverlay.classList.contains('compact')) { searchOverlay.classList.add('compact'); }
            else { closeSearchOverlay(); }
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            if (!searchOverlay?.classList.contains('active')) openSearchOverlay();
            else closeSearchOverlay();
        }
    });

    function performSearch() {
        if (!searchInput || !searchResultsList || !resultsCount) return;
        const query = searchInput.value.toLowerCase().trim();
        const selectedFilters = Array.from(searchFilters).filter(f => f.checked).map(f => f.value);

        if (query.length === 0) {
            searchResultsList.innerHTML = '<div class="search-empty"><p class="search-empty-title">Nenhum resultado encontrado</p><p class="search-empty-text">Digite um termo ou use os filtros</p></div>';
            resultsCount.textContent = '0';
            return;
        }

        const results = searchDatabase.filter(item => {
            const matchesQuery = item.title.toLowerCase().includes(query) || item.description.toLowerCase().includes(query) || item.tag.toLowerCase().includes(query);
            const matchesFilter = selectedFilters.length === 0 || selectedFilters.includes(item.category);
            return matchesQuery && matchesFilter;
        });

        resultsCount.textContent = results.length;
        resultsCount.classList.remove('animate'); void resultsCount.offsetWidth; resultsCount.classList.add('animate');

        if (results.length === 0) {
            searchResultsList.innerHTML = '<div class="search-empty"><p class="search-empty-title">Nenhum resultado para "' + query + '"</p><p class="search-empty-text">Tente outros termos</p></div>';
        } else {
            searchResultsList.innerHTML = results.map(item => `
                <div class="search-result-item" onclick="window.location.href='#'">
                    <div class="search-result-image">${item.image || ''}</div>
                    <div class="search-result-content">
                        <h3 class="search-result-title">${item.title}</h3>
                        <p class="search-result-desc">${item.description}</p>
                        <span class="search-result-tag">${item.tag}</span>
                    </div>
                    <div class="search-result-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg></div>
                </div>
            `).join('');
        }
    }

    if (searchInput) {
        searchInput.addEventListener('input', () => { if (!searchOverlay.classList.contains('compact')) performSearch(); });
        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); searchOverlay.classList.remove('compact'); performSearch(); }
            if (e.key === 'Backspace' && searchInput.value === '' && !searchOverlay.classList.contains('compact')) {
                searchOverlay.classList.add('compact');
                searchFiltersSection?.classList.remove('expanded');
            }
        });
    }

    searchFilters.forEach(f => f.addEventListener('change', performSearch));
    document.getElementById('viewAllBtn')?.addEventListener('click', () => { closeSearchOverlay(); });

    // ===== LANGUAGE SELECTOR =====
    const langBtns = document.querySelectorAll('.lang-btn');
    const langDropdowns = document.querySelectorAll('.lang-dropdown');
    const langOptions = document.querySelectorAll('.lang-option');

    // Move sidebar dropdowns to body
    const sidebarLangDD = document.getElementById('sidebarLangDropdown');
    const sidebarThemeDD = document.getElementById('sidebarThemeDropdown');
    if (sidebarLangDD) document.body.appendChild(sidebarLangDD);
    if (sidebarThemeDD) document.body.appendChild(sidebarThemeDD);

    function positionSidebarDropdown(dropdown, btn) {
        if (!dropdown || !btn) return;
        const sidebarHud = document.getElementById('sidebarHUD');
        const isExpanded = sidebarHud && (sidebarHud.classList.contains('hovered') || sidebarHud.classList.contains('pinned'));
        const sidebarWidth = isExpanded ? 256 : 76;
        const rect = btn.getBoundingClientRect();
        dropdown.style.left = (sidebarWidth + 8) + 'px';
        dropdown.style.right = 'auto';
        if (rect.bottom + 320 > window.innerHeight - 10) {
            dropdown.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
            dropdown.style.top = 'auto';
        } else {
            dropdown.style.top = rect.top + 'px';
            dropdown.style.bottom = 'auto';
        }
    }

    langBtns.forEach(btn => {
        btn.addEventListener('click', e => {
            e.stopPropagation();
            document.querySelectorAll('.lang-dropdown, .theme-dropdown').forEach(d => { if (d !== sidebarLangDD) d.classList.remove('active'); });
            if (sidebarLangDD) { positionSidebarDropdown(sidebarLangDD, btn); sidebarLangDD.classList.toggle('active'); }
        });
    });

    langOptions.forEach(option => {
        option.addEventListener('click', e => {
            e.stopPropagation();
            const lang = option.dataset.lang;
            langOptions.forEach(opt => opt.classList.toggle('active', opt.dataset.lang === lang));
            langBtns.forEach(btn => { btn.querySelector('span') && (btn.querySelector('span').textContent = lang); });
            langDropdowns.forEach(d => d.classList.remove('active'));
        });
    });

    // ===== THEME SELECTOR =====
    const THEME_NAMES = { dark: 'Escuro', light: 'Claro', blue: 'Azul', green: 'Verde', red: 'Vermelho', orange: 'Laranja', pink: 'Rosa', cyan: 'Ciano' };

    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.addEventListener('click', e => {
            e.stopPropagation();
            document.querySelectorAll('.lang-dropdown, .theme-dropdown').forEach(d => { if (d !== sidebarThemeDD) d.classList.remove('active'); });
            if (sidebarThemeDD) { positionSidebarDropdown(sidebarThemeDD, btn); sidebarThemeDD.classList.toggle('active'); }
        });
    });

    function populateSidebarThemes() {
        if (!sidebarThemeDD || sidebarThemeDD.children.length > 0) return;
        const mgr = window.themeManager;
        const available = window.availableThemes;
        const themeKeys = available ? Object.keys(available) : Object.keys(THEME_NAMES);
        const current = mgr?.getCurrentTheme ? mgr.getCurrentTheme().id : 'dark';
        sidebarThemeDD.innerHTML = themeKeys.map(key => {
            const name = available?.[key] ? available[key].name : (THEME_NAMES[key] || key);
            return `<div class="theme-option${key === current ? ' active' : ''}" data-theme="${key}">${name}</div>`;
        }).join('');
        sidebarThemeDD.querySelectorAll('.theme-option').forEach(opt => {
            opt.addEventListener('click', e => {
                e.stopPropagation();
                if (window.themeManager?.applyTheme) window.themeManager.applyTheme(opt.dataset.theme);
                sidebarThemeDD.querySelectorAll('.theme-option').forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                sidebarThemeDD.classList.remove('active');
            });
        });
    }

    const themePoll = setInterval(() => { populateSidebarThemes(); if (sidebarThemeDD?.children.length > 0) clearInterval(themePoll); }, 100);

    document.addEventListener('click', () => {
        document.querySelectorAll('.lang-dropdown, .theme-dropdown').forEach(d => d.classList.remove('active'));
    });

    // ===== MOBILE SIDEBAR =====
    const menuToggle = document.getElementById('menuToggle');
    const sidebarMenu = document.getElementById('sidebarMenu');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const sidebarClose = document.getElementById('sidebarClose');

    function openMobileSidebar() {
        sidebarMenu?.classList.add('active');
        sidebarOverlay?.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeMobileSidebar() {
        sidebarMenu?.classList.remove('active');
        sidebarOverlay?.classList.remove('active');
        document.body.style.overflow = '';
    }

    menuToggle?.addEventListener('click', openMobileSidebar);
    sidebarClose?.addEventListener('click', closeMobileSidebar);
    sidebarOverlay?.addEventListener('click', closeMobileSidebar);

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && sidebarMenu?.classList.contains('active')) closeMobileSidebar();
    });

    // Collapsible submenus
    const collapsibleMenus = [
        { menu: 'gamesMenu', submenu: 'gamesSubmenu' },
        { menu: 'hqMenu', submenu: 'hqSubmenu' },
        { menu: 'operadoresMenu', submenu: 'operadoresSubmenu' },
        { menu: 'midiaMenu', submenu: 'midiaSubmenu' },
        { menu: 'suporteMenu', submenu: 'suporteSubmenu' }
    ];

    collapsibleMenus.forEach(({ menu, submenu }) => {
        const menuEl = document.getElementById(menu);
        const subEl = document.getElementById(submenu);
        if (menuEl && subEl) {
            menuEl.addEventListener('click', e => {
                e.preventDefault();
                menuEl.classList.toggle('expanded');
                subEl.classList.toggle('expanded');
            });
        }
    });

    // ===== DESKTOP SIDEBAR PIN =====
    const sidebarHUD = document.getElementById('sidebarHUD');
    const sidebarPinBtn = document.getElementById('sidebarPinBtn');
    let isPinned = false;
    try { isPinned = localStorage.getItem('sidebar_pinned') === 'true'; } catch (e) {}

    const updateSidebarStates = () => {
        if (!sidebarHUD) return;
        if (isPinned) {
            sidebarHUD.classList.add('pinned');
            document.body.classList.add('sidebar-layout-pinned');
            document.body.classList.remove('sidebar-layout-collapsed');
            sidebarPinBtn?.classList.add('active');
        } else {
            sidebarHUD.classList.remove('pinned');
            document.body.classList.remove('sidebar-layout-pinned');
            document.body.classList.add('sidebar-layout-collapsed');
            sidebarPinBtn?.classList.remove('active');
        }
    };

    updateSidebarStates();

    sidebarPinBtn?.addEventListener('click', e => {
        e.stopPropagation();
        isPinned = !isPinned;
        try { localStorage.setItem('sidebar_pinned', String(isPinned)); } catch (err) {}
        updateSidebarStates();
    });

    // Hover behavior
    if (sidebarHUD) {
        sidebarHUD.addEventListener('mouseenter', () => sidebarHUD.classList.add('hovered'));
        sidebarHUD.addEventListener('mouseleave', () => {
            sidebarHUD.classList.remove('hovered');
            if (!isPinned) document.querySelectorAll('.sidebar-nav-item.expanded').forEach(i => i.classList.remove('expanded'));
        });
    }

    // Desktop submenu triggers
    document.querySelectorAll('.submenu-trigger').forEach(trigger => {
        trigger.addEventListener('click', e => {
            e.preventDefault();
            e.stopPropagation();
            const parent = trigger.closest('.sidebar-nav-item');
            if (parent) {
                if (sidebarHUD && !sidebarHUD.classList.contains('hovered') && !isPinned) sidebarHUD.classList.add('hovered');
                parent.classList.toggle('expanded', !parent.classList.contains('expanded'));
            }
        });
    });

    // ===== ACTIVE ROUTE =====
    const currentPage = window.location.pathname.split('/').pop().split('?')[0].split('#')[0].toLowerCase();

    document.querySelectorAll('.sidebar-nav-link.active').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.sidebar-sub-item-link.active').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.submenu-trigger.active-parent').forEach(el => el.classList.remove('active-parent'));
    document.querySelectorAll('.sidebar-nav-item.expanded').forEach(el => el.classList.remove('expanded'));

    document.querySelectorAll('.sidebar-nav-item').forEach(item => {
        const trigger = item.querySelector('.submenu-trigger');
        const subLinks = item.querySelectorAll('.sidebar-sub-item-link');
        const directLink = item.querySelector('.sidebar-nav-link:not(.submenu-trigger)');
        let found = false;

        subLinks.forEach(link => {
            const href = link.getAttribute('href');
            if (href) {
                const pageName = href.split('/').pop().split('?')[0].split('#')[0].toLowerCase();
                if (pageName && (pageName === currentPage || (currentPage === '' && pageName === 'home.html'))) {
                    link.classList.add('active');
                    found = true;
                }
            }
        });

        if (found && trigger) {
            trigger.classList.add('active-parent');
            item.classList.add('expanded');
        }

        if (directLink) {
            const href = directLink.getAttribute('href');
            if (href) {
                const pageName = href.split('/').pop().split('?')[0].split('#')[0].toLowerCase();
                if (pageName && (pageName === currentPage || (currentPage === '' && pageName === 'home.html'))) {
                    directLink.classList.add('active');
                }
            }
        }
    });

    console.log('%c Navbar HUD standalone carregada!', 'color: #8b5cf6; font-weight: bold;');
})();
</script>
